<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NmapScannerTool Comprehensive Demo</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Courier New', Courier, monospace; padding: 20px; font-size: 16px; margin: 0; }
        .prompt { color: #9ece6a; display: inline; }
        .info { color: #7aa2f7; }
        .warning { color: #e0af68; }
        .success { color: #9ece6a; }
        .comment { color: #565f89; font-style: italic; }
        .cursor { display: inline-block; width: 10px; height: 18px; background: #c0caf5; animation: blink 1s step-end infinite; vertical-align: bottom;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #output { white-space: pre-wrap; line-height: 1.5; margin: 0; display: inline;}
    </style>
</head>
<body>
<div id="output"></div><span id="cursor" class="cursor"></span>

<script>
const outputElem = document.getElementById('output');
const menuShort = "\n=============================================\n      SIZMA TESTİ VE ANALİZ PANELİ      \n=============================================\n1- Hızlı Tarama (-F) [Top 100 Port]\n... (Diğer seçenekler gizlendi)\n7- Çıkış\n=============================================\n\nSeçiminiz (1-7): ";

const flow = [
    { text: "irem@macbook NmapScannerTool % ", type: "prompt" },
    { text: "# Adım 1: Proje yapısını inceleyelim (tree)\n", type: "typed", cssClass: "comment" },
    { text: "irem@macbook NmapScannerTool % ", type: "prompt" },
    { text: "tree -L 2\n", type: "typed" },
    { text: ".\n├── AnalizMotoru.py\n├── Ayarlar.py\n├── Dockerfile\n├── LICENSE\n├── README.md\n├── RaporOlusturucu.py\n├── ScannerTool.py\n├── ZafiyetTarayici.py\n├── demo\n│   ├── demo_terminal.html\n│   └── demo_video.webp\n├── docs\n│   ├── architecture.md\n│   ├── changelog.md\n│   └── testing.md\n└── taramalar\n\n3 directories, 13 files\n", type: "output", delay: 1000 },
    
    { text: "\nirem@macbook NmapScannerTool % ", type: "prompt" },
    { text: "# Adım 2: Syntax Testi (Derleme)\n", type: "typed", cssClass: "comment" },
    { text: "irem@macbook NmapScannerTool % ", type: "prompt" },
    { text: "python3 -m py_compile ScannerTool.py\n", type: "typed" },
    { text: "irem@macbook NmapScannerTool % ", type: "prompt", delay: 500 },
    
    { text: "python3 ScannerTool.py\n", type: "typed" },
    { text: "\n=============================================\n      SIZMA TESTİ VE ANALİZ PANELİ      \n=============================================\n1- Hızlı Tarama (-F) [Top 100 Port]\n2- Cihaz Keşfi (-sn) [Ping Scan]\n3- Servis Versiyon Tespiti (-sV)\n4- İşletim Sistemi Analizi (-O)\n5- Agresif Tarama (-A) [Hepsi Bir Arada]\n6- Zafiyet Taraması (NSE Scripts)\n7- Çıkış\n=============================================\n", type: "output", delay: 500 },
    
    // EDGE CASE
    { text: "\nSeçiminiz (1-7): ", type: "output", delay: 100 },
    { text: "9\n", type: "typed", delay: 500 },
    { text: "Hedef IP veya Domain: ", type: "output", delay: 100 },
    { text: "127.0.0.1\n", type: "typed", delay: 400 },
    { text: "[-] Geçersiz seçim. Lütfen 1-7 arasında seçim yapın.\n", type: "output", delay: 300, cssClass: "warning" },
    
    // MAIN FEATURE
    { text: menuShort, type: "output", delay: 800 },
    { text: "1\n", type: "typed", delay: 400 },
    { text: "Hedef IP veya Domain: ", type: "output", delay: 100 },
    { text: "scanme.nmap.org\n", type: "typed", delay: 600 },
    { text: "\n[+] İşlem başlatıldı: nmap -T4 -F scanme.nmap.org\n", type: "output", delay: 300, cssClass: "info" },
    { text: "Starting Nmap 7.94\nNmap scan report for scanme.nmap.org (45.33.32.156)\nHost is up (0.0031s latency).\nNot shown: 97 closed tcp ports\nPORT    STATE SERVICE\n22/tcp  open  ssh\n80/tcp  open  http\nNmap done: 1 IP address scanned in 0.85 seconds\n", type: "output", delay: 2000 },
    { text: "[*] 2 adet açık port tespit edildi, analiz motoruna iletiliyor...\n", type: "output", delay: 400, cssClass: "info" },
    { text: "\n============================================================\n🛡️  SİSTEM GÜVENLİK ANALİZİ VE TEKNİK ÖNERİLER  🛡️\n============================================================\n", type: "output", delay: 300 },
    { text: "[!] 🔑 SSH: Uzaktan erişim güvenliği ve yetkisiz giriş denemeleri analiz edilmelidir.\n", type: "output", delay: 400, cssClass: "warning" },
    { text: "[!] 🌐 HTTP: Web zafiyetleri (XSS, SQL Injection) ve açık dizin taraması yapılması önerilir.\n", type: "output", delay: 400, cssClass: "warning" },
    { text: "\n[+] Rapor başarıyla oluşturuldu: taramalar/rapor_scanme.nmap.org_detay.txt\n", type: "output", delay: 300, cssClass: "success" },
    { text: "[!] Tarama işlemi tamamlandı.\n", type: "output", delay: 400, cssClass: "success" },
    
    // ÇIKIŞ
    { text: menuShort, type: "output", delay: 800 },
    { text: "7\n", type: "typed", delay: 500 },
    { text: "\n[*] Program kapatılıyor. İyi çalışmalar İrem!\n", type: "output", delay: 300 },
    
    // RAPOR OKUMA
    { text: "\nirem@macbook NmapScannerTool % ", type: "prompt", delay: 500 },
    { text: "# Adım 3: Üretilen final raporun incelenmesi\n", type: "typed", cssClass: "comment" },
    { text: "irem@macbook NmapScannerTool % ", type: "prompt" },
    { text: "cat taramalar/rapor_scanme.nmap.org_detay.txt\n", type: "typed", delay: 500 },
    { text: "--- NMAP TARAMA RAPORU ---\nHedef: scanme.nmap.org\nTarih: 2026-04-06_19-20\n------------------------------\nStarting Nmap 7.94\nNmap scan report for scanme.nmap.org (45.33.32.156)\nHost is up (0.0031s latency).\nPORT    STATE SERVICE\n22/tcp  open  ssh\n80/tcp  open  http\nNmap done: 1 IP address scanned in 0.85 seconds\n", type: "output", delay: 800 },
    
    { text: "\nirem@macbook NmapScannerTool % ", type: "prompt", delay: 500 },
    { text: "# Video demo başarıyla tamamlandı.\n", type: "typed", delay: 200, cssClass: "success" },
    { text: "irem@macbook NmapScannerTool % ", type: "prompt", delay: 500 }
];

let idx = 0;
function nextStep() {
    if (idx >= flow.length) {
        cursor.style.display = 'inline-block';
        return;
    }
    let step = flow[idx];
    if (step.type === "prompt") {
        outputElem.innerHTML += `<span class="prompt">${step.text}</span>`;
        idx++; setTimeout(nextStep, step.delay || 100);
    } else if (step.type === "output") {
        let text = step.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        outputElem.innerHTML += step.cssClass ? `<span class="${step.cssClass}">${text}</span>` : text;
        idx++; setTimeout(nextStep, step.delay || 100);
        window.scrollTo(0, document.body.scrollHeight);
    } else {
        typeEffect(step.text, 0, () => {
            idx++; setTimeout(nextStep, step.delay || 100);
        });
    }
}
function typeEffect(text, j, cb) {
    if (j < text.length) {
        if (text.charAt(j) === '\n') {
            outputElem.innerHTML += '<br>';
        } else {
            outputElem.innerHTML += text.charAt(j);
        }
        window.scrollTo(0, document.body.scrollHeight);
        setTimeout(() => typeEffect(text, j+1, cb), 40 + Math.random() * 30);
    } else { cb(); }
}
setTimeout(nextStep, 1000);
</script>
</body>
</html>
