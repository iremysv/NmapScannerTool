<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NmapScannerTool Comprehensive Demo</title>
    <style>
        body { background-color: #1a1b26; color: #a9b1d6; font-family: 'Inter', 'Courier New', monospace; padding: 40px; font-size: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }
        .window { background: #24283b; width: 85%; max-width: 900px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #414868; }
        .titlebar { background: #1f2335; padding: 10px 15px; display: flex; align-items: center; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .red { background: #f7768e; }
        .yellow { background: #e0af68; }
        .green { background: #9ece6a; }
        .title { flex-grow: 1; text-align: center; color: #565f89; font-size: 13px; font-weight: 600; margin-right: 40px; }
        .terminal { padding: 20px; font-family: 'Fira Code', 'Courier New', monospace; height: 480px; overflow-y: auto; scrollbar-width: none; }
        .prompt { color: #bb9af7; font-weight: bold; }
        .dir { color: #7aa2f7; margin-left: 5px; }
        .command { color: #c0caf5; margin-left: 10px; }
        .info { color: #73daca; }
        .warning { color: #ff9e64; }
        .success { color: #9ece6a; }
        .error { color: #f7768e; }
        .cursor { display: inline-block; width: 8px; height: 17px; background: #c0caf5; animation: blink 1s step-end infinite; vertical-align: middle;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #output { white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
<div class="window">
    <div class="titlebar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <div class="title">zsh — nmap-scanner-tool — 80×24</div>
    </div>
    <div class="terminal" id="term">
        <div id="output"></div><span id="cursor" class="cursor"></span>
    </div>
</div>

<script>
const outputElem = document.getElementById('output');
const terminalElem = document.getElementById('term');

const flow = [
    // 1. SETUP
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "pip install -r requirements.txt\n", type: "typed", delay: 2000 },
    { text: "Collecting colorama==0.4.6\n", type: "output", delay: 1000 },
    { text: "  Downloading colorama-0.4.6-py2.py3-none-any.whl (25 kB)\n", type: "output", delay: 1500 },
    { text: "Installing collected packages: colorama\n", type: "output", delay: 1000 },
    { text: "Successfully installed colorama-0.4.6\n", type: "output", delay: 2000, cssClass: "success" },

    // 2. HELP
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "python main.py --help\n", type: "typed", delay: 3000 },
    { text: "usage: main.py [-h] (-q | -s | -v | -o | -a | -x) -t TARGET\n\nNmapScannerTool: Gelişmiş Ağ Analiz ve Güvenlik Çözümü\n\noptions:\n  -h, --help            show this help message and exit\n  -q, --quick           Hızlı Tarama (-F) [En yaygın 100 port]\n  -s, --discovery       Cihaz Keşfi (-sn) [Ping Scan]\n  -v, --version         Servis Versiyon Tespiti (-sV)\n  -o, --os              İşletim Sistemi Analizi (-O)\n  -a, --aggressive      Agresif Tarama (-A) [Hepsi Bir Arada]\n  -x, --vuln            Zafiyet Taraması (NSE Scripts)\n  -t TARGET, --target TARGET\n                        Hedef IP veya Domain adresi\n", type: "output", delay: 5000 },

    // 3. EXECUTION - SUCCESSFUL DETECTION
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "python main.py --quick --target scanme.nmap.org\n", type: "typed", delay: 3000 },
    { text: "\n[+] Hedef: scanme.nmap.org üzerinde tarama başlatılıyor...\n", type: "output", delay: 200, cssClass: "info" },
    { text: "[+] İşlem başlatıldı: nmap -T4 -F scanme.nmap.org\n", type: "output", delay: 1000, cssClass: "info" },
    { text: "[...] Tarama devam ediyor, lütfen bekleyin...\n", type: "output", delay: 5000 },
    { text: "Starting Nmap 7.94\nNmap scan report for scanme.nmap.org (45.33.32.156)\nHost is up.\nPORT    STATE SERVICE\n22/tcp  open  ssh\n80/tcp  open  http\nNmap done: 1 IP address scanned in 0.85 seconds\n", type: "output", delay: 5000 },
    { text: "[*] 2 adet açık port tespit edildi, analiz motoruna iletiliyor...\n", type: "output", delay: 2000, cssClass: "info" },
    { text: "[...] Risk analizi yapılıyor...\n", type: "output", delay: 3000 },
    { text: "\n============================================================\n🛡️  SİSTEM GÜVENLİK ANALİZİ VE TEKNİK ÖNERİLER  🛡️\n============================================================\n", type: "output", delay: 1000 },
    { text: "[!] 🔑 SSH: Uzaktan erişim güvenliği ve yetkisiz giriş denemeleri analiz edilmelidir.\n", type: "output", delay: 2000, cssClass: "warning" },
    { text: "[!] 🌐 HTTP: Web zafiyetleri (XSS, SQL Injection) ve açık dizin taraması yapılması önerilir.\n", type: "output", delay: 2000, cssClass: "warning" },
    { text: "============================================================\n", type: "output", delay: 1000 },
    { text: "[+] Rapor başarıyla oluşturuldu: taramalar/rapor_scanme.nmap.org_2026-04-06.txt\n", type: "output", delay: 2000, cssClass: "success" },
    { text: "[!] Tarama işlemi tamamlandı.\n\n", type: "output", delay: 3000, cssClass: "success" },

    // 4. CLEAN RESULT
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "python main.py --discovery --target 8.8.8.8\n", type: "typed", delay: 5000 },
    { text: "\n[+] Hedef: 8.8.8.8 üzerinde tarama başlatılıyor...\n", type: "output", delay: 200, cssClass: "info" },
    { text: "[+] İşlem başlatıldı: nmap -T4 -sn 8.8.8.8\n", type: "output", delay: 2000, cssClass: "info" },
    { text: "Starting Nmap 7.94\nNmap scan report for dns.google (8.8.8.8)\nHost is up (0.015s latency).\nNmap done: 1 IP address scanned in 0.12 seconds\n", type: "output", delay: 4000 },
    { text: "[+] Rapor başarıyla oluşturuldu: taramalar/rapor_8.8.8.8_2026-04-06.txt\n", type: "output", delay: 2000, cssClass: "success" },
    { text: "[!] Tarama işlemi tamamlandı.\n\n", type: "output", delay: 3000, cssClass: "success" },

    // 5. ARCHITECTURE
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "wc -l *.py\n", type: "typed", delay: 5000 },
    { text: "      29 AnalizMotoru.py\n      11 Ayarlar.py\n      23 RaporOlusturucu.py\n      71 ScannerTool.py\n      19 ZafiyetTarayici.py\n      53 main.py\n     206 total\n", type: "output", delay: 5000 },

    // 6. FINISH
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: "# Proje analizi tamamlandı. Güvenli kodlama dileğiyle! 🛡️\n", type: "typed", delay: 2000, cssClass: "success" },
    { text: "irem@macbook", type: "prompt" },
    { text: "NmapScannerTool", type: "dir" },
    { text: " ", type: "typed", delay: 5000 }
];

let idx = 0;
function nextStep() {
    if (idx >= flow.length) {
        cursor.style.display = 'inline-block';
        return;
    }
    let step = flow[idx];
    if (step.type === "prompt") {
        outputElem.innerHTML += `<span class="prompt">${step.text}</span>`;
        idx++; setTimeout(nextStep, step.delay || 50);
    } else if (step.type === "dir") {
        outputElem.innerHTML += `<span class="dir">${step.text} % </span>`;
        idx++; setTimeout(nextStep, step.delay || 50);
    } else if (step.type === "output") {
        let text = step.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        outputElem.innerHTML += step.cssClass ? `<span class="${step.cssClass}">${text}</span>` : text;
        idx++; setTimeout(nextStep, step.delay || 50);
        terminalElem.scrollTo(0, terminalElem.scrollHeight);
    } else {
        typeEffect(step.text, 0, () => {
            idx++; setTimeout(nextStep, step.delay || 50);
        });
    }
}
function typeEffect(text, j, cb) {
    if (j < text.length) {
        outputElem.innerHTML += text.charAt(j);
        terminalElem.scrollTo(0, terminalElem.scrollHeight);
        setTimeout(() => typeEffect(text, j+1, cb), 80);
    } else { cb(); }
}
setTimeout(nextStep, 2000);
</script>
</body>
</html>
